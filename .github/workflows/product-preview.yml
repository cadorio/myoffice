name: MyOffice product preview

on:
  push:
    branches: [product/premium-workspace-templates]
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/capture-screenshots.cjs'
      - 'test/**'
      - '.github/workflows/product-preview.yml'

permissions:
  contents: read

concurrency:
  group: myoffice-product-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Testes e pré-visualização da interface
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Executar testes
        run: npm test
      - name: Instalar Playwright
        run: npm install --no-save playwright
      - name: Instalar Chromium
        run: npx playwright install chromium
      - name: Capturar interface real
        run: node tools/capture-screenshots.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MyOffice-Horizon-Preview
          if-no-files-found: error
          path: docs/screenshots/*.png
