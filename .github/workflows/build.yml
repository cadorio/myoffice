name: Instalador Windows

# Compila, verifica e prepara o instalador Windows x64.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, design/lightweight-windows-workspace, security/windows-antivirus-trust, release/1.5.0-professional]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: myoffice-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/design/lightweight-windows-workspace' || github.ref == 'refs/heads/security/windows-antivirus-trust' || github.ref == 'refs/heads/release/1.5.0-professional' || startsWith(github.ref, 'refs/tags/v')
    name: Windows x64
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Instalar Chromium para capturas
        run: npm install --no-save playwright
      - name: Gerar capturas reais do MyOffice
        run: |
          npx playwright install chromium
          node tools/capture-screenshots.cjs
      - name: Atualizar capturas na branch da PR
        if: github.ref == 'refs/heads/design/lightweight-windows-workspace' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/myoffice-captures"
          cp docs/screenshots/inicio.png docs/screenshots/texto.png docs/screenshots/folhas.png docs/screenshots/diapositivos.png docs/screenshots/modo-escuro.png "$RUNNER_TEMP/myoffice-captures/"
          branch="${{ github.event.pull_request.head.ref || github.ref_name }}"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$branch"
            git checkout -f -B screenshot-update "origin/$branch"
            cp "$RUNNER_TEMP"/myoffice-captures/*.png docs/screenshots/
            git add docs/screenshots/inicio.png docs/screenshots/texto.png docs/screenshots/folhas.png docs/screenshots/diapositivos.png docs/screenshots/modo-escuro.png
            if git diff --cached --quiet; then
              echo "As capturas já estão atualizadas."
              exit 0
            fi
            git commit -m "docs: refresh MyOffice screenshots"
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            echo "A branch mudou durante o push; vou tentar novamente."
          done
          echo "Não foi possível atualizar as capturas após 5 tentativas."
          exit 1
      # A assinatura Windows requer um certificado Authenticode em WIN_CSC_LINK e a respetiva password.
      - name: Preparar assinatura
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$WIN_CSC_LINK" ]; then
            echo "CSC_LINK=$WIN_CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$WIN_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "Sem certificado Authenticode: o instalador ficará sem assinatura."
          fi
      - name: Criar instalador Windows x64
        run: npx electron-builder --win --x64 --publish never
      - name: Verificar instalador, analisar com Microsoft Defender e gerar provas de integridade
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem 'dist' -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'O instalador EXE não foi encontrado.' }

          $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
          if ($env:WIN_CSC_LINK) {
            if ($signature.Status -ne 'Valid') {
              throw "A assinatura Authenticode devia ser válida, mas o estado é: $($signature.Status)"
            }
          }

          $hash = Get-FileHash -Algorithm SHA256 -Path $installer.FullName
          "$($hash.Hash)  $($installer.Name)" | Set-Content -Encoding ascii "$($installer.FullName).sha256"
          @(
            "Ficheiro: $($installer.Name)"
            "SHA-256: $($hash.Hash)"
            "Assinatura Authenticode: $($signature.Status)"
            "Signatário: $(if ($signature.SignerCertificate) { $signature.SignerCertificate.Subject } else { 'Nenhum' })"
            "Data UTC: $([DateTime]::UtcNow.ToString('o'))"
          ) | Set-Content -Encoding utf8 'dist/SECURITY-REPORT.txt'

          $defender = Join-Path $env:ProgramFiles 'Windows Defender/MpCmdRun.exe'
          if (Test-Path $defender) {
            $scanOutput = (& $defender -Scan -ScanType 3 -File $installer.FullName 2>&1 | Out-String)
            $scanExitCode = $LASTEXITCODE
            $scanOutput | Set-Content -Encoding utf8 'dist/DEFENDER-SCAN.txt'
            if ($scanExitCode -ne 0) { throw "O Microsoft Defender reportou um problema (código $scanExitCode)." }
            if ($scanOutput -match '(?i)was skipped|scan.*skipped|ignorado|ignorada') {
              Add-Content 'dist/SECURITY-REPORT.txt' 'Microsoft Defender: o pedido de análise foi aceite, mas o motor ignorou este ficheiro; não existe resultado de deteção para o instalador.'
            } else {
              Add-Content 'dist/SECURITY-REPORT.txt' 'Microsoft Defender: comando de análise concluído sem mensagens de ficheiro ignorado. Isto não é uma certificação de ausência de malware.'
            }
          } else {
            Add-Content 'dist/SECURITY-REPORT.txt' 'Microsoft Defender: ferramenta não disponível neste runner; análise não executada.'
          }

          npm sbom --omit=dev --sbom-format cyclonedx | Out-File -Encoding utf8 'dist/MyOffice-sbom.cdx.json'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MyOffice-Windows
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.sha256
            dist/SECURITY-REPORT.txt
            dist/DEFENDER-SCAN.txt
            dist/MyOffice-sbom.cdx.json

  release:
    name: Publicar Release Windows
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
          generate_release_notes: true
